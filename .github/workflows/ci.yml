name: CI & Quality Gates

on:
  push:
    branches:
      - main
      - "chore/**"
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Build & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Formatting check (Prettier)
        run: npm run format:check || echo "Notice: Code formatting issues detected. Run 'npm run format' to reformat."

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint code quality
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Run database & RLS tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run test:db

      - name: Production build
        run: npm run build

      - name: Dependency audit (non-blocking)
        run: npm audit --audit-level=critical || true

      - name: Verify Docker Container Build
        run: docker build -t crm-x-app:ci .
