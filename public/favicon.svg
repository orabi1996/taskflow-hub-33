<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="crmx-bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0B3C49" />
      <stop offset="100%" stopColor="#0F4C5C" />
    </linearGradient>

    <linearGradient id="crmx-desc" x1="40" y1="40" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0F4C5C" />
      <stop offset="65%" stopColor="#00A6A6" />
      <stop offset="100%" stopColor="#22C8B8" />
    </linearGradient>

    <linearGradient id="crmx-asc" x1="40" y1="160" x2="160" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#00A6A6" />
      <stop offset="45%" stopColor="#7AE7C7" />
      <stop offset="100%" stopColor="#00A6A6" />
    </linearGradient>

    <linearGradient id="crmx-facet" x1="85" y1="85" x2="115" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0F4C5C" stopOpacity="0.4" />
      <stop offset="50%" stopColor="#7AE7C7" stopOpacity="0.8" />
      <stop offset="100%" stopColor="#00A6A6" stopOpacity="0.3" />
    </linearGradient>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="200" height="200" rx="46" fill="url(#crmx-bg)" />

  <!-- Descending Ribbon -->
  <line x1="56" y1="52" x2="144" y2="148" stroke="url(#crmx-desc)" stroke-width="34" stroke-linecap="round" />

  <!-- Ascending Ribbon -->
  <line x1="56" y1="148" x2="144" y2="52" stroke="url(#crmx-asc)" stroke-width="34" stroke-linecap="round" />

  <!-- Intersection Translucent Fold Highlight -->
  <path d="M 85 85 L 115 85 L 115 115 L 85 115 Z" fill="url(#crmx-facet)" opacity="0.8" />
</svg>
